const easeOutBack=t=>1+2.70158*(t-1)**3+1.70158*(t-1)**2;

const completed=new Set();

const UNLOCK_ALL=true; // test build: every level open for playtesting
function unlocked(i){return i>=0&&i<LEVELS.length&&(UNLOCK_ALL||i===0||completed.has(i-1)||completed.has(i));}
function navigation(){document.getElementById('prev').disabled=!unlocked(lvIdx-1);document.getElementById('next').disabled=!unlocked(lvIdx+1);}
function saveWin(){completed.add(lvIdx);try{localStorage.setItem('meo-tien-do',JSON.stringify([...completed]));}catch(e){}navigation();}
function showTip(){document.getElementById('hint').textContent=HINTS[lvIdx]||TIPS[tipIndex%TIPS.length];}
setInterval(()=>{if(lvIdx>=HINTS.length&&!selecting){tipIndex++;showTip();}},6000);
function closeLevels(){selecting=false;document.getElementById('levelScreen').style.display='none';document.getElementById('levels').focus();}
function openLevels(){selecting=true;drag=null;const grid=document.getElementById('levelGrid');grid.replaceChildren();LEVELS.forEach((lv,i)=>{const b=document.createElement('button'),done=completed.has(i),locked=!unlocked(i);b.textContent=String(i+1);b.disabled=locked;b.setAttribute('aria-label','Màn '+(i+1)+' · '+lv.name+(locked?' · Đã khóa':done?' · Hoàn thành':''));if(i===lvIdx)b.setAttribute('aria-current','true');if(locked||done){const m=document.createElement('small');m.textContent=locked?'🔒':'★';b.appendChild(m);}b.onclick=()=>{closeLevels();load(i);};grid.appendChild(b);});document.getElementById('levelScreen').style.display='flex';document.getElementById('closeLevels').focus();}

function load(i) {
  if(!unlocked(i))return;
  generation++; drag = null; flight = null; impacts = []; streaks = []; happy.clear(); moves = 0;
  lvIdx = i;
  const lv = LEVELS[lvIdx];
  state = parseLevel(lv);
  anim = { ball: null, particles: [], falling: [], rocks: [], springPulse: null };
  busy = false; waves = [];
  document.getElementById('title').textContent = 'Màn ' + (lvIdx + 1) + ' · ' + LEVELS[lvIdx].name;
  showTip(); navigation();
  document.getElementById('overlay').style.display = 'none';
  hud(); resize();
}
function hud() {
  document.getElementById('cats').textContent = catsLeft(state);
  document.getElementById('balls').textContent = ballsOf(state).length;
}
function resize() {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cell = Math.floor(Math.min((r.width - 30) / state.w, (r.height - 30) / state.h, 84));
  ox = (r.width - cell * state.w) / 2; oy = (r.height - cell * state.h) / 2;
}
addEventListener('resize', () => state && resize());

// ---------- input: slingshot ----------
function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', e => {
  if (busy || selecting || document.getElementById('overlay').style.display==='flex') return;
  const p = pos(e);
  if(!onBoard(Math.floor((p.x-ox)/cell),Math.floor((p.y-oy)/cell)))return;
  let best = null, bd = cell * .8; // pick the ball nearest to the touch
  for (const b of ballsOf(state)) {
    const bx = ox + (b.x + .5) * cell, by = oy + (b.y + .5) * cell, d = Math.hypot(p.x - bx, p.y - by);
    if (d < bd) { bd = d; best = { b, bx, by }; }
  }
  if (best) { drag = { ball: best.b, sx: best.bx, sy: best.by, x: p.x, y: p.y }; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener('pointermove', e => { if (drag) Object.assign(drag, pos(e)); });
cv.addEventListener('pointercancel', () => { drag = null; });
cv.addEventListener('lostpointercapture', () => { drag = null; });
cv.addEventListener('pointerup', e => {
  if (drag) Object.assign(drag, pos(e));
  if (!drag) return;
  const d = dragDir(), b = drag.ball; drag = null;
  if (d !== null) fire(b, DIRS[d]);
});
function dragDir() {
  const dx = drag.sx - drag.x, dy = drag.sy - drag.y; // opposite of pull
  if (Math.hypot(dx, dy) < cell * 0.4) return null;
  const a = Math.atan2(dy, dx); // 0 = right
  const idx = Math.round(a / (Math.PI / 2)); // -2..2
  return { 0: 1, 1: 2, 2: 3, '-2': 3, '-1': 0 }[idx];
}

// ---------- shot playback ----------
async function fire(ball, dir) {
  if (busy) return;
  busy = true; moves++; const token = generation;
  const { state: ns, events } = shoot(state, ball, dir);
  state.grid[ball.y][ball.x] = state.grid[ball.y][ball.x] === 'm' ? 'M' : '.'; anim.ball = { ...ball }; hud();
  for (const ev of events) {
    if (token !== generation) return;
    if (ev.t === 'move') await tween(ev.x, ev.y, [400,260,150,70][ev.speed ?? 3], token);
    else if (ev.t === 'tp') { burst(anim.ball.x, anim.ball.y, '#b46cff', 10); anim.ball = { x: ev.x, y: ev.y }; streaks.push({...ev,born:performance.now()}); burst(ev.x, ev.y, '#b46cff', 10); await wait(120); }
    else if (ev.t === 'rock') { state.grid[ev.y][ev.x] = '.'; anim.rocks.push({ x: ev.x, y: ev.y, t: 0 }); burst(ev.x, ev.y, '#999', 14); await wait(80); }
    else if (ev.t === 'spring') { anim.springPulse = { x: ev.x, y: ev.y, t: 0 }; await wait(60); }
    else if (ev.t === 'carpet') { sfx('carpet'); dust(ev.x,ev.y); await wait(80); }
    else if (ev.t === 'bump') { sfx('bump'); impacts.push({...ev,born:performance.now(),bx:anim.ball.x,by:anim.ball.y}); await wait(240); }
    else if (ev.t === 'rest') { anim.ball = null; state.grid[ev.y][ev.x] = state.grid[ev.y][ev.x] === 'M' ? 'm' : 'B'; await wait(120); }
    else if (ev.t === 'vanish') { burst(ev.x, ev.y, '#ffffff', 12); anim.ball = null; await wait(350); }
    else if (ev.t === 'splash') {
      burst(ev.x, ev.y, '#4fc3ff', 40, true); anim.ball = null; // ball bursts and is gone
      for(let y=0;y<state.h;y++)for(let x=0;x<state.w;x++)if(state.grid[y][x]==='C'&&ev.cats.some(c=>Math.abs(c.x-x)<=1&&Math.abs(c.y-y)<=1))happy.set(x+','+y,performance.now());
      for (const c of ev.cats) { state.grid[c.y][c.x] = '.'; anim.falling.push({ x: c.x, y: c.y, vy: -3, dy: 0, rot: 0 }); }
      await wait(500);
    }
  }
  if (token !== generation) return;
  state = ns; anim.ball = null; hud(); busy = false;
  if (catsLeft(state) === 0) end(true);
  else if (ballsOf(state).length === 0) end(false);
}
function tween(x, y, ms, token = generation) {
  if(!flight)sfx('whoosh');const from = { ...anim.ball }, t0 = performance.now();
  return new Promise(res => { (function step() {
    if (token !== generation) return res();
    const raw = Math.min(1, (performance.now() - t0) / ms), k = raw*raw*(3-2*raw);
    anim.ball = { x: from.x + (x - from.x) * k, y: from.y + (y - from.y) * k };
    raw < 1 ? requestAnimationFrame(step) : res();
  })(); });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function burst(x, y, col, n, water) {
  sfx(water?'splash':col==='#b46cff'?'warp':'pop');if (water) waves.push({x, y, born: performance.now()});
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = (water ? 2 : 1) * (1 + Math.random() * 3);
    anim.particles.push({ x: (x + .5) * cell, y: (y + .5) * cell, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, born:performance.now()+(water?80:0),water,shred:water&&i<5,col,r: water ? 3 + Math.random() * 4 : 3 });
  }
}
function end(win) {if(win)saveWin();sfx(win?'win':'lose');if(win){celebrate=performance.now();for(let i=0;i<65;i++)anim.particles.push({x:Math.random()*state.w*cell,y:-Math.random()*cell*3,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,life:3,born:performance.now(),col:coats[i%8][0],r:3+Math.random()*3});}
  const o = document.getElementById('overlay'), b = document.getElementById('obtn');
  document.getElementById('msg').innerHTML = win ? '<span class="stars">★★★</span>Mèo mát rượi!<small>Hoàn thành màn '+(lvIdx+1)+' sau '+moves+' lượt bắn.<br>Một cơn mưa thật vui!</small>' : '<span class="stars">✦</span>Thử lại nhé!<small>Đổi hướng bắn để làm ướt hết mèo.</small>';
  b.textContent = win ? (lvIdx+1<LEVELS.length?'Màn tiếp':'Chọn màn chơi') : 'Chơi lại';
  b.onclick = () => win && lvIdx+1===LEVELS.length ? openLevels() : load(win ? lvIdx+1 : lvIdx);
  const token = generation; setTimeout(() => {if(token===generation)o.style.display = 'flex';}, 400);
}

 ctx.beginPath();ctx.moveTo(-.38,-.12);ctx.lineTo(-.38+ear,-.43);ctx.quadraticCurveTo(-.37+ear,-.5,-.17,-.32);ctx.quadraticCurveTo(0,-.39,.17,-.32);ctx.quadraticCurveTo(.37-ear,-.5,.38-ear,-.43);ctx.lineTo(.38,-.12);ctx.bezierCurveTo(.49,.31,.36,.4,0,.4);ctx.bezierCurveTo(-.36,.4,-.49,.31,-.38,-.12);ctx.closePath();ctx.fill();ctx.stroke();ctx.save();ctx.clip();ctx.fillStyle=c[1];ctx.beginPath();ctx.moveTo(-.5,.19);ctx.lineTo(.5,.08);ctx.lineTo(.5,.5);ctx.lineTo(-.5,.5);ctx.fill();ctx.restore();ctx.strokeStyle='#ffffff';ctx.lineWidth=.014;ctx.beginPath();ctx.moveTo(-.33,.12);ctx.lineTo(-.33,-.35);ctx.lineTo(-.18,-.24);ctx.stroke();ctx.fillStyle='#ffffff';ctx.beginPath();ctx.moveTo(-.25,-.29);ctx.lineTo(-.12,-.32);ctx.lineTo(.05,-.27);ctx.lineTo(-.20,-.24);ctx.fill();
 ctx.fillStyle=PALETTE.blush;for(const k of [-1,1]){ctx.beginPath();ctx.moveTo(k*.32,-.36);ctx.lineTo(k*.31,-.19);ctx.lineTo(k*.2,-.28);ctx.fill();}
 ctx.fillStyle=PALETTE.white;ctx.beginPath();ctx.moveTo(0,-.1);ctx.bezierCurveTo(-.32,-.32,-.39,.02,0,.32);ctx.bezierCurveTo(.39,.02,.32,-.32,0,-.1);ctx.fill();oval(-.22,-.23,.07,.035,PALETTE.art3);
